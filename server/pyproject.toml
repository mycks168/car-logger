[project]
name = "gps-monitor"
version = "0.1.0"
description = "GPS 監視サーバ - ラズパイからGPSを取得しSlackへ通知する"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "insightface>=0.7.3",
    "onnxruntime-gpu>=1.18.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "slack-bolt>=1.18.0",
    "slack-sdk>=3.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gps_monitor", "gps_web", "temp_monitor"]
