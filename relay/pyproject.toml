[project]
name = "gps-relay"
version = "0.1.0"
description = "GPS Push/Pull中継サーバ - ESP32からのGPS PushをキャッシュしPullで提供する"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gps_relay"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
